[package]
name = "adb-fastboot-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Fast, pure Rust unified adb and fastboot tool suite"

[[bin]]
name = "adb-rs"
path = "src/main_adb.rs"

[[bin]]
name = "fastboot-rs"
path = "src/main_fastboot.rs"

[features]
default = ["usb", "tls"]
usb = ["adb-protocol/usb-android", "fastboot-protocol/usb-android"]
usb-rusb = ["adb-protocol/usb-rusb"]
tls = ["adb-protocol/tls", "dep:rustls"]

[dependencies]
adb-protocol = { path = "../adb-protocol" }
adb-mdns = { path = "../adb-mdns" }
fastboot-protocol = { path = "../fastboot-protocol", default-features = false }
base64 = "0.22"
lz4_flex = "0.11"
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
libc = "0.2"
byteorder = "1.5"
inotify = "0.11"
zip = { version = "2" }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
