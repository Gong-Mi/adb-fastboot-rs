[package]
name = "adb-fastboot-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Fast, pure Rust unified adb and fastboot tool suite"

[[bin]]
name = "adb-rs"
path = "src/main_adb.rs"

[[bin]]
name = "fastboot-rs"
path = "src/main_fastboot.rs"

[features]
default = []
usb = ["adb-protocol/usb-android", "fastboot-protocol/usb-android"]
tls = ["adb-protocol/tls"]

[dependencies]
adb-protocol = { path = "../adb-protocol" }
fastboot-protocol = { path = "../fastboot-protocol", default-features = false }
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
libc = "0.2"
byteorder = "1.5"
zip = { version = "2" }
