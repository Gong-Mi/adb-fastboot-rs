[package]
name = "fastboot-protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure Rust Fastboot protocol framing, status response parser, and sparse image header decoder"

[features]
default = []
usb = []
usb-rusb = ["usb", "dep:rusb"]
usb-android = ["usb", "dep:libc"]

[dependencies]
thiserror = "1.0"
byteorder = "1.5"
libc = { version = "0.2", optional = true }
rusb = { version = "0.9", optional = true, default-features = false }
